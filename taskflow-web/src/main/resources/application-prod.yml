# 生产环境
server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://your-prod-host:3306/taskflow?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
taskflow:
  upload:
    path: /data/uploads/
logging:
  level:
    com.taskflow: info
  file:
    path: /var/log/taskflow/